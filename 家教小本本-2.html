<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">

<title>家教小本本</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fdf9f6;--card:#fff;--tx:#4a4458;--mu:#8f889c;--bd:#f1e8e8;--pk:#fce6ec;--mt:#dcf2e8;--lv:#ece4f9;--bt:#fef4d6;--pc:#feeade;--sk:#e0f1fb;--ac:#b79be0;--acx:#fff}

:root[data-theme="dark"]{--bg:#1d1a24;--card:#282432;--tx:#eee9f6;--mu:#a59db4;--bd:#383247;--pk:#4a3440;--mt:#2c4a3f;--lv:#3d3558;--bt:#4d4529;--pc:#4f3829;--sk:#2b4256;--acx:#1d1a24}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.5}
main{max-width:860px;margin:0 auto;padding:16px 14px 90px;position:relative}

h1{font-size:1.35rem;margin:4px 0 14px;display:flex;align-items:center;gap:8px}

button.s{background:var(--lv);color:var(--tx);padding:7px 12px;font-size:.84rem}
button.x{background:transparent;color:var(--mu);border:1px solid var(--bd);padding:6px 11px;font-size:.8rem}

.tag.p{background:var(--mt)}.tag.u{background:var(--pc)}
.mu{color:var(--mu);font-size:.85rem}
.ls{padding:11px 0;border-top:1px dashed var(--bd)}.ls:first-child{border-top:0}
.fs{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}

.stat{border-radius:16px;padding:12px;color:var(--tx)}.stat b{display:block;font-size:1.25rem}.stat span{font-size:.78rem;display:flex;gap:4px;align-items:center;color:var(--mu)}

.ov{position:fixed;inset:0;background:rgba(40,30,60,.45);z-index:9;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:860px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:16px 14px calc(20px + env(safe-area-inset-bottom,0px))}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.gw{overflow-x:auto}.gt{min-width:520px}
.gh{display:grid;grid-template-columns:42px repeat(7,1fr);font-size:.8rem;color:var(--mu);text-align:center;padding-bottom:6px}
.gb{display:flex}.ax{width:42px;flex:none;font-size:.68rem;color:var(--mu)}.ax div{height:46px}
.cols{flex:1;display:grid;grid-template-columns:repeat(7,1fr)}
.col{position:relative;border-left:1px solid var(--bd);background-image:repeating-linear-gradient(to bottom,var(--bd) 0,var(--bd) 1px,transparent 1px,transparent 46px)}

.blk b{display:block;font-size:.78rem}
</style>
</head>
<body>
<main id="app"></main>
<div id="msg"></div>
<div id="msgb" class="row" style="justify-content:center;margin:4px 0 90px"></div>
<nav id="nav"></nav>
<div id="ov" class="ov" style="display:none"><div class="sheet" id="sh"></div></div>
<script>
(function(){
var COL=["--pk","--mt","--lv","--bt","--pc","--sk"],DAYS=["一","二","三","四","五","六","日"];
var D={students:[],lessons:[],paidM:{},skip:{},trials:[]},ref=null,mode="local",LS="tutor-v2",page="students",selId="",detId="",mon=ymd(new Date()).slice(0,7);
var $=function(i){return document.getElementById(i)};
var P={star:'<path d="M12 3l2.6 5.6 6 .8-4.4 4.2 1.1 6L12 16.7l-5.3 2.9 1.1-6L3.4 9.4l6-.8z"/>',users:'<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5M16 5.2a3 3 0 010 5.6M18 14.8c1.8.7 3 2.4 3 5.2"/>',cal:'<rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',pen:'<path d="M4 20l1-4L16.5 4.5a2 2 0 013 3L8 19z"/>',chart:'<path d="M5 20V10M12 20V4M19 20v-7"/>',clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',pin:'<path d="M12 21s6-5.3 6-10a6 6 0 00-12 0c0 4.7 6 10 6 10z"/><circle cx="12" cy="11" r="2"/>',coin:'<circle cx="12" cy="12" r="8.5"/><path d="M14.5 9.5c-.5-1-1.5-1.5-2.5-1.5-1.4 0-2.5.8-2.5 2s1 1.6 2.5 2 2.5.8 2.5 2-1.1 2-2.5 2c-1 0-2-.5-2.5-1.5"/>',book:'<path d="M4 5.5C6.5 4.5 9.5 4.5 12 6c2.5-1.5 5.5-1.5 8-.5V19c-2.5-1-5.5-1-8 .5-2.5-1.5-5.5-1.5-8-.5zM12 6v13.5"/>',plus:'<path d="M12 5v14M5 12h14"/>',back:'<path d="M15 5l-7 7 7 7"/>',user:'<circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6"/>',eye:'<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/>',dl:'<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',hw:'<path d="M5 4h11l3 3v13H5zM9 11h6M9 15h6"/>',hat:'<path d="M2.5 9.5L12 5l9.5 4.5L12 14zM6.5 11.5V16c1.5 1.5 3.4 2 5.5 2s4-.5 5.5-2v-4.5"/>'};
function ic(n,s){return '<svg class="ic" width="'+(s||16)+'" height="'+(s||16)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+P[n]+'</svg>'}
function title(t){return '<h1><span class="stars">'+ic("star",20)+'</span>'+t+'</h1>'}
function esc(s){var d=document.createElement("div");d.textContent=s==null?"":String(s);return d.innerHTML}
function money(n){return "$"+Math.round(n).toLocaleString("zh-TW")}
function uid(){return "i"+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function stu(id){return D.students.filter(function(s){return s.id===id})[0]}
function colr(s){var i=D.students.indexOf(s);return "var("+COL[(i<0?0:i)%6]+")"}
function tn(t){var a=(t||"0:0").split(":");return +a[0]+(+a[1]||0)/60}
function p2(n){return (n<10?"0":"")+n}
function wk(d){return DAYS[(new Date(d+"T12:00:00").getDay()+6)%7]||""}
function normT(v){v=String(v||"").replace(/[：.]/g,":").trim();var m;if(/^\d{1,2}$/.test(v))v=v+":00";else if((m=v.match(/^(\d{1,2}):(\d{1,2})$/)))v=m[1]+":"+m[2];else if(/^\d{3,4}$/.test(v))v=v.slice(0,-2)+":"+v.slice(-2);else return "";m=v.split(":");if(+m[0]>23||+m[1]>59)return "";return p2(+m[0])+":"+p2(+m[1])}
function fmtT(x){var h=Math.floor(x),m=Math.round((x-h)*60);if(m===60){h++;m=0}if(h>23){h=23;m=59}return p2(h)+":"+p2(m)}
function fixTimes(){document.querySelectorAll('input[type=time]').forEach(function(x){x.type="text";x.setAttribute("inputmode","numeric");x.placeholder="例 18:00";x.maxLength=5});["f_","l_","e_","t_"].forEach(function(p){["","2"].forEach(function(q){var a=$(p+"start"+q),b=$(p+"end"+q);if(a&&b&&a.value&&b.value&&tn(b.value)>tn(a.value))a.dataset.dur=tn(b.value)-tn(a.value)})})}
function ymd(d){return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())}
function payDate(id,m){var p=D.paidM[id+"_"+m];return p&&typeof p==="object"?(p.date||""):""}
function payCard(s,m){var p=D.paidM[s.id+"_"+m.m],o=p&&typeof p==="object"?p:{};
 return '<div class="card" style="background:var(--mt)"><h2>'+ic("coin")+'月費繳費紀錄・'+m.m+'</h2><div class="mu" style="margin-bottom:8px">本月應繳 '+money(m.fee)+'（'+m.hrs+' 小時 × '+money(s.rate||0)+'）　'+(m.paid?'<span class="tag p">已繳費</span>':'<span class="tag u">尚未繳費</span>')+'</div>'+
 '<div class="g3"><div><label>繳費日期</label><input type="date" id="p_date" value="'+(o.date||ymd(new Date()))+'"></div><div><label>實收金額 (NT$)</label><input type="number" id="p_amt" value="'+(o.amount!=null?o.amount:Math.round(m.fee))+'"></div><div><label>付款方式 / 備註</label><input id="p_note" value="'+esc(o.note||"")+'" placeholder="例：轉帳、現金、LINE Pay"></div></div>'+
 '<div class="row" style="margin-top:10px"><button data-paysave="'+s.id+'">'+ic("plus")+(m.paid?'更新繳費紀錄':'登記已繳費')+'</button>'+(m.paid?'<button class="x" data-payundo="'+s.id+'">取消繳費紀錄</button>':'')+'</div></div>'}
function tagsL(l){var c={"出席":"var(--mt)","請假":"var(--pc)","調課":"var(--bt)","放假":"var(--sk)","臨時取消":"var(--pk)"};if(l.cancel)return ' <span class="tag">已取消</span>';var h=l.att?' <span class="tag" style="background:'+c[l.att]+'">'+l.att+'</span>':'';if(!l.att&&!l.topic&&!l.hw&&!l.note)h=' <span class="tag" style="background:var(--bt)">'+(l.date>ymd(new Date())?'待上課':'待記錄')+'</span>';return h}
function optAtt(v){return [["","未標記"],["出席","出席"],["請假","請假"],["調課","調課"],["放假","放假"],["臨時取消","臨時取消"]].map(function(o){return '<option value="'+o[0]+'"'+(o[0]===(v||"")?' selected':'')+'>'+o[1]+'</option>'}).join("")}
var NOC=["請假","放假","臨時取消"];
function slotsOf(s){return s.slots&&s.slots.length?s.slots:(s.day?[{day:s.day,start:s.start,end:s.end,rep:"1"}]:[])}
function sched(s){return slotsOf(s).map(function(x){return (x.rep==="2"?"每兩週":"每週")+x.day+" "+x.start+"-"+x.end}).join("、")}
function mkSlots(){var a=[{day:$("f_day").value,start:normT($("f_start").value),end:normT($("f_end").value),rep:$("f_rep").value}];if($("f_day2").value&&normT($("f_start2").value)&&normT($("f_end2").value))a.push({day:$("f_day2").value,start:normT($("f_start2").value),end:normT($("f_end2").value),rep:$("f_rep2").value});return a}
function slotRow(q,sl,opt){sl=sl||{};var dop=(opt?'<option value="">不使用</option>':'')+DAYS.map(function(d){return '<option value="'+d+'"'+(sl.day===d?' selected':'')+'>週'+d+'</option>'}).join("");return '<div><label>上課日</label><select id="f_day'+q+'">'+dop+'</select></div><div><label>重複</label><select id="f_rep'+q+'"><option value="1"'+(sl.rep==="2"?'':' selected')+'>每週</option><option value="2"'+(sl.rep==="2"?' selected':'')+'>每兩週</option></select></div><div><label>開始時間</label><input type="time" id="f_start'+q+'" value="'+(sl.start||"")+'"></div><div><label>結束時間</label><input type="time" id="f_end'+q+'" value="'+(sl.end||"")+'"></div>'}
function ensure(){
  var ch=false,now=new Date(),today=ymd(now),end=ymd(new Date(now.getTime()+31*864e5));
  var nb=D.lessons.length;D.lessons=D.lessons.filter(function(l){return !(l.auto&&!l.edited&&!l.cancel&&!l.att&&!l.topic&&!l.hw&&!l.note&&!l.paid&&l.date>end)});if(D.lessons.length!==nb)ch=true;
  D.students.forEach(function(s){
    var SL=slotsOf(s).filter(function(sl){return DAYS.indexOf(sl.day)>=0&&sl.start&&sl.end&&tn(sl.end)>tn(sl.start)});if(!SL.length)return;
    var key={};D.lessons.forEach(function(l){if(l.sid===s.id){key[l.date]=1;if(l.orig)key[l.orig]=1}});Object.keys(D.skip||{}).forEach(function(k){if(k.indexOf(s.id+"|")===0)key[k.slice(s.id.length+1)]=1});
    var fm=new Date((s.from||today)+"T12:00:00"),fmon=fm.getTime()-((fm.getDay()+6)%7)*864e5;
    var d=new Date(fm.getTime()),lim=new Date(now.getTime()-365*864e5);if(d<lim)d=lim;
    for(var n=0;n<500&&ymd(d)<=end;n++,d=new Date(d.getTime()+864e5)){
      var ds=ymd(d),wd0=(d.getDay()+6)%7;
      SL.forEach(function(sl){
        if(DAYS.indexOf(sl.day)!==wd0||key[ds])return;
        if(sl.rep==="2"&&Math.round((d.getTime()-wd0*864e5-fmon)/(7*864e5))%2!==0)return;
        D.lessons.push({id:uid(),sid:s.id,date:ds,start:sl.start,end:sl.end,hours:Math.round((tn(sl.end)-tn(sl.start))*4)/4,cnt:1,topic:"",hw:"",note:"",paid:false,auto:true,orig:ds});ch=true;
      });
    }
  });
  return ch;
}
var NAV=[["students","users","學生"],["schedule","cal","時間表"],["records","pen","課堂紀錄"],["stats","chart","統計"]];

function save(){
  try{localStorage.setItem(LS,JSON.stringify(D))}catch(e){}
  if(mode==="db"&&ref)ref.set(JSON.parse(JSON.stringify(D))).catch(function(){$("msg").textContent="雲端儲存失敗，已暫存在此瀏覽器"});
  render();
}
function go(p){page=p;if(p!=="detail")location.hash=p;render();window.scrollTo(0,0)}

/* ---------- 計算（費用一律 = 時數 × 時薪） ---------- */
function stuMonth(s,m){
  var A=D.lessons.filter(function(l){return l.sid===s.id&&l.date.slice(0,7)===m}),L=A.filter(function(l){return !l.cancel&&NOC.indexOf(l.att)<0});
  var cnt=0,hrs=0,un=0;
  L.forEach(function(l){cnt+=l.cnt||1;hrs+=l.hours||0;if(!l.paid)un+=(l.hours||0)*(s.rate||0)});
  var fee=hrs*(s.rate||0),paid=!!D.paidM[s.id+"_"+m];
  if(s.billing==="monthly")un=paid?0:fee;
  return {s:s,m:m,A:A,L:L,cnt:cnt,hrs:hrs,fee:fee,paid:paid,unpaid:un};
}
function monthStats(m){return D.students.map(function(s){return stuMonth(s,m)})}
function feeText(s){return money(s.rate||0)+" / 小時・"+(s.billing==="monthly"?"月繳":"單次結清")}

/* ---------- 頁面 ---------- */
function vStudents(){
  var h=title("學生總覽");
  h+=D.students.length?'<div class="g2">'+D.students.map(function(s){
    return '<div class="st" data-open="'+s.id+'" style="background:'+colr(s)+'"><h3>'+esc(s.name)+'</h3><small>'+esc(s.grade||"")+' 英文</small>'+
    '<div class="ln">'+ic("clock",14)+esc(sched(s))+'</div>'+
    '<div class="ln">'+ic("pin",14)+esc(s.place||"未填")+'</div><div class="ln">'+ic("coin",14)+feeText(s)+'</div></div>'}).join("")+'</div>'
    :'<div class="empty">'+ic("star",28)+'還沒有學生，新增第一位吧</div>';
  return h+'<div style="margin-top:14px"><button data-new="1">'+ic("plus")+'新增學生</button></div>';
}
function studentForm(s){
  s=s||{billing:"single",day:"一",start:"18:00",end:"20:00"};
  var sl=slotsOf(s);
  return '<h2>'+ic("star")+(s.id?'編輯學生':'新增學生')+'</h2>'+
  '<div class="fs"><h3>'+ic("user",15)+'基本資料</h3><div class="g2">'+
  '<div><label>姓名</label><input id="f_name" value="'+esc(s.name||"")+'"></div>'+
  '<div><label>年級</label><input id="f_grade" value="'+esc(s.grade||"")+'" placeholder="例：國二"></div>'+
  '<div><label>上課地點</label><input id="f_place" value="'+esc(s.place||"")+'"></div>'+
  '<div><label>家長聯絡方式</label><input id="f_contact" value="'+esc(s.contact||"")+'" placeholder="電話 / LINE"></div></div></div>'+

document.addEventListener("click",function(e){
  var t=e.target,a=function(k){var n=t.closest("["+k+"]");return n?n.getAttribute(k):null},v;
  if((v=a("data-p")))return go(v);
  if(t.closest("[data-close]")||t.id==="ov")return close_();
  if(a("data-back"))return go("students");

  if((v=a("data-edit")))return sheet(studentForm(stu(v)));
  if((v=a("data-gorec"))){selId=v;return go("records")}
  if(a("data-savestu")!==null){
    var id=a("data-savestu"),name=$("f_name").value.trim();if(!name)return $("f_name").focus();
    var o={id:id||uid(),name:name,grade:$("f_grade").value.trim(),place:$("f_place").value.trim(),day:$("f_day").value,start:normT($("f_start").value),end:normT($("f_end").value),slots:mkSlots(),billing:$("f_bill").value,rate:parseFloat($("f_fee").value)||0,from:$("f_from").value||ymd(new Date()),contact:$("f_contact").value.trim(),memo:$("f_memo").value.trim()};
    var old0=id?stu(id):null;if(id)D.students=D.students.map(function(s){return s.id===id?o:s});else D.students.push(o);
    if(id&&old0){var oS=slotsOf(old0),nS=slotsOf(o),td0=ymd(new Date()),sig=function(a){return JSON.stringify(a.map(function(x){return [x.day,x.start,x.end,x.rep]}))};
      if(sig(oS)!==sig(nS)&&o.from<td0)o.from=td0;
      D.lessons=D.lessons.filter(function(l){
        if(!(l.sid===id&&l.auto&&!l.edited&&l.date>=td0))return true;
        var dt=new Date(l.date+"T12:00:00"),cw=(dt.getDay()+6)%7,k=-1;
        oS.forEach(function(x,j){if(k<0&&DAYS.indexOf(x.day)===cw&&x.start===l.start&&x.end===l.end)k=j});
        if(k<0)return true;
        var ns=nS[k],empty=!l.topic&&!l.hw&&!l.note&&!l.att&&!l.paid;
        if(!ns)return !empty;
        if(ns.rep!==oS[k].rep&&empty)return false;
        var nd=ymd(new Date(dt.getTime()+(DAYS.indexOf(ns.day)-cw)*864e5));
        l.date=nd;l.orig=nd;l.start=ns.start;l.end=ns.end;l.hours=Math.round((tn(ns.end)-tn(ns.start))*4)/4;return true})}
    ensure();
    close_();return save();
  }
  if((v=a("data-delstu"))){if(confirm("刪除學生與其所有紀錄？")){D.students=D.students.filter(function(s){return s.id!==v});D.lessons=D.lessons.filter(function(l){return l.sid!==v});close_();page="students";save()}return}
  if(a("data-addl")){
    var l={id:uid(),sid:selId,date:$("l_date").value,start:$("l_start").value,end:$("l_end").value,hours:parseFloat($("l_hours").value)||0,cnt:parseInt($("l_cnt").value)||1,att:$("l_att").value,topic:$("l_topic").value.trim(),hw:$("l_hw").value.trim(),note:$("l_note").value.trim(),paid:$("l_paid")?$("l_paid").value==="1":false};
    if(!l.date)return;D.lessons.push(l);mon=l.date.slice(0,7);return save();
  }
  if((v=a("data-paidtrial"))){(D.trials||[]).forEach(function(q){if(q.id===v)q.paid=!q.paid});return save()}
  if(a("data-newtrial"))return sheetTrial("");
  if((v=a("data-edittrial")))return sheetTrial(v);
  if(a("data-savetrial")!==null){
    var tid=a("data-savetrial"),nm=$("t_name").value.trim();if(!nm)return $("t_name").focus();
    var ts=normT($("t_start").value);if(!ts)return $("t_start").focus();
    var te=normT($("t_end").value);if(!te||tn(te)<=tn(ts))te=fmtT(tn(ts)+1);
    var o2={id:tid||uid(),date:$("t_date").value||ymd(new Date()),start:ts,end:te,name:nm,grade:$("t_grade").value.trim(),place:$("t_place").value.trim(),note:$("t_note").value.trim(),status:$("t_status").value,rate:parseFloat($("t_rate").value)||0,paid:$("t_paid").value==="1"};
    D.trials=D.trials||[];if(tid)D.trials=D.trials.map(function(q){return q.id===tid?o2:q});else D.trials.push(o2);
    mon=o2.date.slice(0,7);close_();return save();
  }
  if((v=a("data-tostu"))){var tx=(D.trials||[]).filter(function(q){return q.id===v})[0];if(tx)sheet(studentForm({name:tx.name,grade:tx.grade,place:tx.place,billing:"single",day:wk(tx.date)||"一",start:tx.start,end:tx.end,from:tx.date}));return}
  if((v=a("data-deltrialask"))){var b2=t.closest("[data-deltrialask]");b2.setAttribute("data-deltrial",v);b2.removeAttribute("data-deltrialask");b2.textContent="再按一次確認刪除";return}
  if((v=a("data-deltrial"))){D.trials=(D.trials||[]).filter(function(q){return q.id!==v});close_();return save()}
  if(a("data-reconnect")){return connect()}
  if(a("data-perm")){claude.use("permissions").then(function(pm){return pm&&pm.manage?pm.manage():null}).then(function(){return connect()}).catch(function(){$("msg").textContent="無法開啟權限設定，請從網站的選單找「權限」"});return}
  if(a("data-backup"))return sheetBackup();
  if(a("data-copybk")){var o3=$("bk_out");o3.select();var okc=false;try{okc=document.execCommand("copy")}catch(e){}if(!okc&&navigator.clipboard)navigator.clipboard.writeText(o3.value).then(function(){$("msg").textContent="已複製備份文字"},function(){});else $("msg").textContent=okc?"已複製備份文字":"請長按文字框手動全選複製";return}
  if(a("data-dlbk")){claude.use("downloads").then(function(d){if(!d)throw 0;return d.save({filename:"家教小本本備份-"+ymd(new Date())+".json",data:JSON.stringify(D)})}).catch(function(){$("msg").textContent="無法下載，請改用「複製備份文字」"});return}
  if(a("data-restoreask")){var b3=t.closest("[data-restoreask]");b3.setAttribute("data-restore","1");b3.removeAttribute("data-restoreask");b3.textContent="再按一次確認還原";return}
  if(a("data-restore")){
    var src=$("bk_in").value.trim(),x2;
    try{x2=JSON.parse(src)}catch(e){$("msg").textContent="備份文字格式不正確";return}
    if(!x2||!Array.isArray(x2.students)){$("msg").textContent="這不是有效的備份";return}
    D={students:x2.students||[],lessons:x2.lessons||[],paidM:x2.paidM||{},skip:x2.skip||{},trials:x2.trials||[]};
    ensure();close_();save();$("msg").textContent="已還原備份";return
  }
  if((v=a("data-editl")))return sheetLesson(v);
  if((v=a("data-savel"))){var l2=D.lessons.filter(function(x){return x.id===v})[0];if(l2){l2.date=$("e_date").value||l2.date;l2.start=$("e_start").value;l2.end=$("e_end").value;l2.hours=parseFloat($("e_hours").value)||0;l2.cnt=parseInt($("e_cnt").value)||1;l2.topic=$("e_topic").value.trim();l2.hw=$("e_hw").value.trim();l2.note=$("e_note").value.trim();if($("e_paid"))l2.paid=$("e_paid").value==="1";l2.att=$("e_att").value;l2.cancel=false;l2.edited=true;mon=l2.date.slice(0,7)}close_();return save()}
  if((v=a("data-cancell"))){D.lessons.forEach(function(x){if(x.id===v)x.cancel=!x.cancel});close_();return save()}
  if((v=a("data-paidl"))){D.lessons.forEach(function(l){if(l.id===v)l.paid=!l.paid});return save()}
  if((v=a("data-paysave"))){D.paidM[v+"_"+mon]={date:$("p_date").value||ymd(new Date()),amount:parseFloat($("p_amt").value)||0,note:$("p_note").value.trim()};return save()}
  if((v=a("data-payundo"))){delete D.paidM[v+"_"+mon];return save()}
  if((v=a("data-paidm"))){var k=v+"_"+mon;D.paidM[k]=!D.paidM[k];return save()}
  if((v=a("data-delask"))){var b=t.closest("[data-delask]");b.setAttribute("data-dell",v);b.removeAttribute("data-delask");b.textContent="再按一次確認刪除";return}
  if((v=a("data-dell"))){close_();{var dl=D.lessons.filter(function(l){return l.id===v})[0];if(dl&&dl.sid){D.skip=D.skip||{};D.skip[dl.sid+"|"+(dl.orig||dl.date)]=1}D.lessons=D.lessons.filter(function(l){return l.id!==v});save()}return}
  if(a("data-parent")){
    var s=stu(selId);
    return sheet(parentHTML(s,stuMonth(s,mon))+'<div class="row" style="margin-top:10px"><button data-dl="1">'+ic("dl")+'下載給家長</button><button class="x" data-close="1">關閉</button></div><div class="mu" style="margin-top:6px">這是家長看到的版本，也可以直接截圖傳給家長。</div>');
  }
  if(a("data-dl")){
    var s2=stu(selId),m2=stuMonth(s2,mon);
    claude.use("downloads").then(function(d){if(!d)throw 0;return d.save({filename:s2.name+"-"+mon+"-學習進度.html",data:'<!DOCTYPE html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">'+parentHTML(s2,m2)})}).catch(function(){$("msg").textContent="無法下載，請改用截圖傳給家長"});
  }
});

 try{var x=JSON.parse(localStorage.getItem(LS)||"null");if(x)D=x}catch(e){}if(ensure())try{localStorage.setItem(LS,JSON.stringify(D))}catch(e){}render();
 var unsub=null;
 async function connect(){
   var why="";
   $("msg").textContent="正在連線雲端…";
   try{
     var db=await claude.use("db"),u=await claude.use("user");
     if(!db)why="尚未取得雲端儲存權限（可能未登入 Claude、權限被拒絕，或不是從 Claude 內打開）";
     else if(!u)why="無法辨識登入身分";
     else{
       var id=await u.id();
       if(!id)why="沒有登入身分，請先登入 Claude";
       else{
         if(unsub){try{unsub()}catch(e){}}
         ref=db.doc("data/users/"+id+"/store/main");mode="db";
         var first=true;
         unsub=ref.onSnapshot(function(sn){
           if(sn.exists){var x=sn.data();D={students:x.students||[],lessons:x.lessons||[],paidM:x.paidM||{},skip:x.skip||{},trials:x.trials||[]};if(ensure())ref.set(JSON.parse(JSON.stringify(D)));render()}
           else if(first&&(D.students.length||D.lessons.length)){ref.set(JSON.parse(JSON.stringify(D)))}
           first=false;
         },function(){mode="local";ref=null;$("msg").textContent="雲端讀取失敗，資料暫存在此瀏覽器"});
         $("msg").textContent="資料已同步到你的帳號";return;
       }
     }
   }catch(e){why="連線雲端時發生錯誤"}
   mode="local";ref=null;
   $("msg").textContent="資料暫存在此瀏覽器："+why;
 }
